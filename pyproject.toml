[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-chatbot-eval"
version = "0.1.0"
description = "Laya AI-powered chatbot evaluation framework with >80% accuracy"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Laya Evaluation Team"}
]
keywords = ["laya", "chatbot", "evaluation", "nlp", "ai", "metrics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "laya>=0.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "typing-extensions>=4.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/laya-chatbot-eval"
Documentation = "https://laya-chatbot-eval.readthedocs.io"
Repository = "https://github.com/yourusername/laya-chatbot-eval"
Issues = "https://github.com/yourusername/laya-chatbot-eval/issues"

[tool.setuptools]
packages = ["laya_eval", "laya_eval.core", "laya_eval.metrics", "laya_eval.preprocessing",
            "laya_eval.models", "laya_eval.calibration", "laya_eval.finetuning",
            "laya_eval.reporting", "laya_eval.utils"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
